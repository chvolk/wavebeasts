{% extends "base.html" %}
{% block title %}Sign in · WaveBeasts{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px">
  <h1>Sign in</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign in</button>
  </form>
  <p class="muted">No account? <a href="/signup/">Create one</a>.</p>
</div>
{% endblock %}
